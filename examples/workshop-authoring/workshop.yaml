apiVersion: jupyterlab-workshop/v1alpha1
name: workshop-authoring
title: Writing your first workshop
version: 0.1.0
description: Scaffold, edit, lint and publish a workshop of your own with the jupyter workshop command and author mode.
authors: [Graham Dumpleton]
homepage: https://github.com/GrahamDumpleton/jupyterlab-workshop/tree/main/examples/workshop-authoring
issues: https://github.com/GrahamDumpleton/jupyterlab-workshop/issues
tags: [authoring, cli, meta]
duration: 25m
platforms: [linux, macos, windows]
capabilities:
  - terminal
  - write-files
  - kernel-exec
requires:
  tools:
    - { name: jupyter }
    - { name: node, optional: true }
layout: default
gating: strict
layouts:
  default:
    main:
      areas:
        - { tabs: [] }
        - { size: 0.4, tabs: ["terminal:author"] }
variables:
  - name: workshop_dir
    type: path
    default: my-workshop
    description: Directory the new workshop is scaffolded into
pages:
  - pages/01-what-a-workshop-is.md
  - pages/02-scaffold.md
  - pages/03-write-a-page.md
  - pages/04-lint.md
  - pages/05-test-and-publish.md
