apiVersion: jupyterlab-workshop/v1alpha1
name: git-basics
title: Git from the command line
version: 0.1.0
description: Learn init, add, commit, diff, branch, merge and conflict resolution from the terminal.
finish: |
  You now have the everyday git commands under your fingers. Try the
  **Hello JupyterLab** workshop next to see what actions can do with
  notebooks and kernels, or come back to any page here to review it.
authors: [Graham Dumpleton]
tags: [git, cli, beginner]
duration: 30m
platforms: [linux, macos, windows]
capabilities:
  - terminal
  - write-files: [workspace]
  - kernel-exec
  - auto-run
# The terminal is only a few lines tall, so git must not page its output.
env:
  PAGER: cat
  GIT_PAGER: cat
requires:
  tools:
    - { name: git, version: ">=2.30", hint: { macos: "brew install git", linux: "apt install git", windows: "winget install Git.Git" } }
layout: default
gating: soft
layouts:
  default:
    left: collapsed
    right: { widget: instructions, size: 0.25 }
    main:
      - { area: top, widgets: ["markdown:README.md"] }
      - { area: bottom, widgets: ["terminal:git"], size: 0.4 }
variables:
  - name: repo_dir
    type: path
    default: demo
    description: Directory in which the practice repository is created
  - name: user_name
    type: text
    description: The name git records on your commits
  - name: user_email
    type: email
    description: The email address git records on your commits
pages:
  - pages/01-create-a-repository.md
  - pages/02-first-commit.md
  - pages/03-edit-and-diff.md
  - pages/04-branch-and-merge.md
  - pages/05-resolve-a-conflict.md
