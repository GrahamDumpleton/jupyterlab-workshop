[build-system]
requires = ["hatchling>=1.5.0", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.2.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab-workshop"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyter_server>=2.13.0,<3",
    "pyyaml>=6.0.3",
]
dynamic = ["version", "description", "authors", "keywords"]

[project.optional-dependencies]
test = [
    "playwright>=1.45",
]
mcp = [
    "mcp>=1.0",
]
lite = [
    "jupyterlite-core>=0.8.3,<0.9",
    "jupyterlite-pyodide-kernel>=0.8.5,<0.9",
    "jupyterlite-terminal>=1.6,<2",
]

[project.urls]
Homepage = "https://github.com/GrahamDumpleton/jupyterlab-workshop"
Documentation = "https://jupyterlab-workshop.readthedocs.io/"
Repository = "https://github.com/GrahamDumpleton/jupyterlab-workshop.git"
Issues = "https://github.com/GrahamDumpleton/jupyterlab-workshop/issues"

[project.scripts]
jupyter-workshop = "jupyterlab_workshop.cli:main"

[dependency-groups]
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "furo>=2024.8",
    "sphinx-autobuild>=2024.10",
]
dev = [
    "jupyterlab>=4.6.0,<5",
    "jupyter-builder>=1.2.0,<2",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-jupyter[server]>=0.10",
    "ruff>=0.5",
    { include-group = "docs" },
    "playwright>=1.45",
    "mcp>=1.0",
    "jupyterlite-core>=0.8.3,<0.9",
    "jupyterlite-pyodide-kernel>=0.8.5,<0.9",
    "jupyterlite-terminal>=1.6,<2",
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = [
    "jupyterlab_workshop/labextension",
    "jupyterlab_workshop/nodejs",
    "jupyterlab_workshop/schema",
]
exclude = [".github", "scratch", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["jupyterlab_workshop"]
artifacts = [
    "jupyterlab_workshop/nodejs",
    "jupyterlab_workshop/schema",
]

[tool.hatch.build.targets.wheel.force-include]
"skills/workshop-author" = "jupyterlab_workshop/skills/workshop-author"

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_workshop/labextension/static" = "share/jupyter/labextensions/@jupyterlab-workshop/labextension/static"
"jupyterlab_workshop/labextension/schemas" = "share/jupyter/labextensions/@jupyterlab-workshop/labextension/schemas"
"jupyterlab_workshop/labextension/package.json" = "share/jupyter/labextensions/@jupyterlab-workshop/labextension/package.json"
"install.json" = "share/jupyter/labextensions/@jupyterlab-workshop/labextension/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.version]
path = "jupyterlab_workshop/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_workshop/labextension/static/style.js",
    "jupyterlab_workshop/labextension/package.json",
    "jupyterlab_workshop/nodejs/workshop-cli.cjs",
    "jupyterlab_workshop/schema/workshop.schema.json",
]
skip-if-exists = ["jupyterlab_workshop/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "packages"
build_dir = "jupyterlab_workshop/labextension"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["scratch", "jupyterlab_workshop/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
packages = ["jupyterlab_workshop"]
strict = true
ignore_missing_imports = true

[tool.check-wheel-contents]
ignore = ["W002"]
