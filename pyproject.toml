[build-system]
requires = ["hatchling>=1.5.0", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.2.0,<2"]
build-backend = "hatchling.build"

[project]
name = "educates-jupyterlab-workshop"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyter_server>=2.13.0,<3",
    "pyyaml>=6.0.3",
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.0,<5",
    "jupyter-builder>=1.2.0,<2",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-jupyter[server]>=0.10",
    "ruff>=0.5",
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["educates_jupyterlab_workshop/labextension"]
exclude = [".github", "scratch", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["educates_jupyterlab_workshop"]

[tool.hatch.build.targets.wheel.shared-data]
"educates_jupyterlab_workshop/labextension" = "share/jupyter/labextensions/@educates/jupyterlab-workshop"
"install.json" = "share/jupyter/labextensions/@educates/jupyterlab-workshop/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.version]
path = "educates_jupyterlab_workshop/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "educates_jupyterlab_workshop/labextension/static/style.js",
    "educates_jupyterlab_workshop/labextension/package.json",
]
skip-if-exists = ["educates_jupyterlab_workshop/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "packages"
build_dir = "educates_jupyterlab_workshop/labextension"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["scratch", "educates_jupyterlab_workshop/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
packages = ["educates_jupyterlab_workshop"]
strict = true
ignore_missing_imports = true

[tool.check-wheel-contents]
ignore = ["W002"]
