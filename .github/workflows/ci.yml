name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: extractions/setup-just@v4
      - name: Install
        run: just install
      - name: Lint
        run: just lint
      - name: Type check
        run: just typecheck
      - name: Unit tests
        run: just test
      - name: Build the docs
        run: just docs
      - name: Build the distribution
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  browser:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: extractions/setup-just@v4
      - name: Install
        run: just install
      - name: Install browsers
        run: |
          cd tests/ui-tests && uv run jlpm install && uv run jlpm playwright install --with-deps chromium
          uv run playwright install --with-deps chromium
      - name: Galata tests
        run: just test-ui
      - name: Workshop self-tests
        run: just selftest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: tests/ui-tests/test-results

  lite:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: extractions/setup-just@v4
      - name: Install micromamba for the JupyterLite terminal build
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C "$HOME/.local" bin/micromamba
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install
        run: just install
      - name: Install browsers
        run: uv run playwright install --with-deps chromium
      - name: Lint the examples for JupyterLite
        run: uv run jupyter workshop lint examples/hello-jupyterlab --platform lite
      - name: Workshop self-test in JupyterLite
        run: uv run jupyter workshop test examples/hello-jupyterlab --lite --junit results-lite.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-lite
          path: results-lite.xml

  windows:
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: extractions/setup-just@v4
      - name: Install
        run: just install
      - name: Unit tests
        run: just test
      - name: Lint the examples for Windows
        run: |
          uv run jupyter workshop lint examples/git-basics --platform windows
          uv run jupyter workshop lint examples/hello-jupyterlab --platform windows
          uv run jupyter workshop lint examples/workshop-authoring --platform windows
      - name: Install browsers
        run: uv run playwright install chromium
      - name: Workshop self-test
        run: uv run jupyter workshop test examples/git-basics --junit results-windows.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-windows
          path: results-windows.xml
