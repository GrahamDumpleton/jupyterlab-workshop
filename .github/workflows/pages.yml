name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: extractions/setup-just@v4
      - name: Install micromamba for the JupyterLite terminal build
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C "$HOME/.local" bin/micromamba
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install
        run: just install
      - name: Assemble the site (landing page, schemas and the JupyterLite demo)
        run: just pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
